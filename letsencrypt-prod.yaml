apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: admin@example.com
    server: https://acme-v02.api.letsencrypt.org/directory
    profile: tlsserver
    privateKeySecretRef:
      name: issuer-account-key
    solvers:
    - http01:
        gatewayHTTPRoute:
          parentRefs:
          - name: secure-gateway
            namespace: nginx-gateway
            kind: Gateway
    - dns01: 
        cloudflare:
          apiTokenSecretRef:
            name: dns-api-token
            key: token