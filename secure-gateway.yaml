# This manifest will help to assign the NGF data plane pods into the control-plane and defining the NodePorts
---
apiVersion: gateway.nginx.org/v1alpha2
kind: NginxProxy
metadata:
  name: secure-proxy-config
  namespace: nginx-gateway
spec:
  kubernetes:
    service:
      externalTrafficPolicy: Cluster
      type: NodePort
      nodePorts:
      - listenerPort: 80
        port: 30080
      - listenerPort: 443
        port: 30443
    deployment:
      replicas: 1
      pod:
        tolerations:
          - effect: NoSchedule
            operator: Exists
            key: node-role.kubernetes.io/control-plane
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: Exists
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nginx-gateway-fabric
                    app.kubernetes.io/component: nginx
                topologyKey: kubernetes.io/hostname

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: secure-gateway
  namespace: nginx-gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: nginx
  infrastructure:
    parametersRef:
      group: gateway.nginx.org
      kind: NginxProxy
      name: secure-proxy-config
  listeners:
  - name: http
    port: 80
    protocol: HTTP
  - name: https
    port: 443
    protocol: HTTPS
    hostname: "*.secure.gpm.my.id"
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: secure-gateway-secret